name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deal_analyzer
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B clean verify
        working-directory: backend
      - name: Preserve full-suite reports before PostgreSQL verification
        run: mv backend/target/surefire-reports backend/target/full-suite-reports
      - run: mvn -B -Dtest=PersistenceHardeningTest,SchemaAndOrmEvidenceTest test
        working-directory: backend
        env:
          HARDENING_DATABASE_URL: jdbc:postgresql://localhost:5432/ci
          DATABASE_PASSWORD: ci-only-password
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Install the browser for the narrow-width accessibility gate
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Narrow-width layout and contrast gate
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            backend/target/full-suite-reports
            backend/target/failsafe-reports
            backend/target/surefire-reports
            backend/target/hardening
            backend/target/readiness
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m venv /tmp/scanners
          /tmp/scanners/bin/pip install semgrep==1.177.0
          echo /tmp/scanners/bin >> "$GITHUB_PATH"
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
          sha256sum --check --ignore-missing trivy_0.74.0_checksums.txt
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          rm trivy trivy_0.74.0_Linux-64bit.tar.gz trivy_0.74.0_checksums.txt
      - run: mvn -B -DskipTests package
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: docker build -t deal-analyzer:ci backend
      - run: docker build -f backend/Dockerfile.parser -t deal-analyzer-parser:ci backend
      - run: docker build -f backend/Dockerfile.parser --target test-probe -t deal-analyzer-parser-probe:ci backend
      - name: Verify application dispatch and native decoder confinement
        working-directory: backend
        run: >-
          mvn -B -Dit.test=ContainerParserIT
          -Dparser.test.image="$(docker image inspect deal-analyzer-parser:ci --format '{{.Id}}')"
          -Dparser.probe.image="$(docker image inspect deal-analyzer-parser-probe:ci --format '{{.Id}}')"
          failsafe:integration-test failsafe:verify
      - name: Measure document latency through confined parser
        working-directory: backend
        run: >-
          mvn -B -Dtest=DocumentPerformanceAcceptanceTest
          -Dparser.performance.image="$(docker image inspect deal-analyzer-parser:ci --format '{{.Id}}')"
          test
      - run: python3 scripts/check-parser-container.py deal-analyzer:ci
      - run: bash scripts/security-checks.sh
        env:
          RELEASE_IMAGE: deal-analyzer:ci
          PARSER_IMAGE: deal-analyzer-parser:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-and-parser-evidence
          path: |
            target/hardening
            backend/target/failsafe-reports
          retention-days: 14
