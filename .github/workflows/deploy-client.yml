name: Deploy pilot client manually
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-client-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test deploy/cloudflare/worker.test.mjs
      # Configure ORIGIN_URL and ORIGIN_SECRET in the Worker before running this workflow.
      - run: npx --yes wrangler@4.45.0 deploy --config deploy/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
