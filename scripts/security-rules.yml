rules:
  - id: no-react-raw-html
    languages: [typescript, javascript]
    severity: ERROR
    message: Render untrusted report and provider content as text.
    pattern: <$TAG dangerouslySetInnerHTML={$VALUE} ... />
  - id: no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: Do not execute strings as browser code.
    pattern: eval(...)
  - id: no-weak-digest
    languages: [java]
    severity: ERROR
    message: Use the approved SHA-256 credential protection boundary.
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
  - id: no-shell-runtime-exec
    languages: [java]
    severity: ERROR
    message: Use the isolated parser with a fixed argument vector.
    pattern: Runtime.getRuntime().exec(...)
  - id: document-parsing-only-in-disposable-worker
    languages: [java]
    severity: ERROR
    message: Parse untrusted documents only inside the disposable parser worker.
    pattern-either:
      - pattern: org.apache.pdfbox.Loader.loadPDF(...)
      - pattern: javax.imageio.ImageIO.read(...)
      - pattern: new com.dealanalyzer.document.LocalDocumentInspector(...)
      - pattern: new com.dealanalyzer.document.HardenedImageDecoder(...)
    paths:
      exclude:
        - '**/DocumentParserWorker.java'
        - '**/LocalDocumentInspector.java'
        - '**/HardenedImageDecoder.java'
  - id: no-xslt-view
    languages: [java]
    severity: ERROR
    message: XsltView is exposed to CVE-2026-47884 on Spring Framework 6.2; see .trivyignore and ticket 85.
    pattern-regex: \bXsltView(Resolver)?\b
