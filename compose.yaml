services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deal_analyzer
      POSTGRES_USER: deal_analyzer
      POSTGRES_PASSWORD: deal_analyzer
    ports:
      - "${DATABASE_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_analyzer -d deal_analyzer"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - deal-analyzer-postgres:/var/lib/postgresql/data

volumes:
  deal-analyzer-postgres:
