Foreground yes
User clamav
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
LogVerbose no
StreamMaxLength 22M
MaxScanSize 100M
MaxFileSize 22M
MaxRecursion 16
MaxFiles 10000
MaxThreads 2
ReadTimeout 30
CommandReadTimeout 10
ScanPDF yes
ScanArchive yes
AlertExceedsMax yes
