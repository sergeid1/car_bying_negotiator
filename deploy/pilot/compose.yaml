name: otdog-pilot
services:
  backend:
    image: ${BACKEND_IMAGE:?Set an immutable registry digest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    pids_limit: 128
    restart: unless-stopped
    env_file:
      - path: /run/otdog-pilot/backend.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: pilot
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "8080"
      DOCUMENT_STORAGE_PROVIDER: s3
      DOCUMENT_STORAGE_ALLOW_FILE: "false"
      DOCUMENT_MALWARE_SCANNER: clamav
      DOCUMENT_CLAMAV_HOST: 127.0.0.1
      DOCUMENT_PARSER_MODE: container
      DOCUMENT_PARSER_CONTAINER_ENDPOINT: unix:///run/parser/docker.sock
      DOCUMENT_PARSER_CONTAINER_EXECUTABLE: /usr/bin/docker
      DOCUMENT_PARSER_CONTAINER_IMAGE: ${PARSER_IMAGE_ID:?Load image into dedicated rootless daemon}
      DOCUMENT_PARSER_MAX_CONCURRENT: "1"
      MAILBOX_SENDER: none
      DEALER_RELAY_PROVIDER: none
    volumes:
      # Dedicated rootless daemon owned by host UID 10001; never /var/run/docker.sock.
      - /run/user/10001/docker.sock:/run/parser/docker.sock
      - /etc/otdog/rds-ca.pem:/etc/ssl/rds-ca.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
  clamav:
    image: ${CLAMAV_IMAGE:?Set a reviewed ClamAV image digest}
    network_mode: host
    restart: unless-stopped
    mem_limit: 1280m
    pids_limit: 128
    volumes:
      - clamav-signatures:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - ./freshclam.conf:/etc/clamav/freshclam.conf:ro
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
  ingress:
    image: ${NGINX_IMAGE:?Set a reviewed Nginx image digest}
    network_mode: host
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - /run/otdog-pilot/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.inc:/run/otdog-proxy.inc:ro
      - /run/otdog-pilot/tls.crt:/run/tls.crt:ro
      - /run/otdog-pilot/tls.key:/run/tls.key:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=1m
    logging:
      driver: local
      options: { max-size: "2m", max-file: "2" }
volumes:
  clamav-signatures:
