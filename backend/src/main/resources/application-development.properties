# Explicit local development profile only; pilot/production must supply real SMTP.
spring.mail.host=${SPRING_MAIL_HOST:127.0.0.1}
spring.mail.port=${SPRING_MAIL_PORT:1025}
# Mailpit's loopback SMTP listener requires neither authentication nor STARTTLS.
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
case.recovery.from=${CASE_RECOVERY_FROM:deal-xray@localhost.test}
account.session.cookie-secure=false
