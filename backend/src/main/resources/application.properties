spring.application.name=ai-deal-analyzer
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/deal_analyzer}
spring.datasource.username=${DATABASE_USERNAME:deal_analyzer}
spring.datasource.password=${DATABASE_PASSWORD:deal_analyzer}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web.servlet.PageNotFound=OFF
logging.level.org.apache.pdfbox=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
case.access.pepper=${CASE_ACCESS_PEPPER}
case.access.lifetime=${CASE_ACCESS_LIFETIME:PT720H}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:21MB}
document.limits.max-file-bytes=${DOCUMENT_MAX_FILE_BYTES:20971520}
document.limits.max-pages=${DOCUMENT_MAX_PAGES:25}
document.limits.max-pixels=${DOCUMENT_MAX_PIXELS:40000000}
document.limits.min-width=${DOCUMENT_MIN_WIDTH:1}
document.limits.min-height=${DOCUMENT_MIN_HEIGHT:1}
document.limits.max-expansion-ratio=${DOCUMENT_MAX_EXPANSION_RATIO:10000}
document.retention=${DOCUMENT_RETENTION:PT720H}
document.storage.path=${DOCUMENT_STORAGE_PATH:./var/document-objects}
document.storage.encryption-key=${DOCUMENT_STORAGE_ENCRYPTION_KEY:}
document.malware-scanner=${DOCUMENT_MALWARE_SCANNER:clamav}
document.clamav.host=${DOCUMENT_CLAMAV_HOST:127.0.0.1}
document.clamav.port=${DOCUMENT_CLAMAV_PORT:3310}
document.clamav.connect-timeout=${DOCUMENT_CLAMAV_CONNECT_TIMEOUT:PT2S}
document.clamav.read-timeout=${DOCUMENT_CLAMAV_READ_TIMEOUT:PT10S}
document.retention-cleanup-delay=${DOCUMENT_RETENTION_CLEANUP_DELAY:PT5M}
document.heic.decoder-command=${DOCUMENT_HEIC_DECODER_COMMAND:heif-dec}
document.decoder.timeout=${DOCUMENT_DECODER_TIMEOUT:PT10S}
document.normalization.dpi=${DOCUMENT_NORMALIZATION_DPI:144}
document.normalization.max-page-pixels=${DOCUMENT_NORMALIZATION_MAX_PAGE_PIXELS:40000000}
extraction.material-confidence-threshold=${EXTRACTION_MATERIAL_CONFIDENCE_THRESHOLD:0.85}
# Recovery is opt-in. Configure SPRING_MAIL_HOST and credentials only when enabling delivery.
case.recovery.public-url=${CASE_RECOVERY_PUBLIC_URL:http://localhost:5173/}
case.recovery.from=${CASE_RECOVERY_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
