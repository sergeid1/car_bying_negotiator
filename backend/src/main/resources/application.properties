spring.application.name=ai-deal-analyzer
# Production/pilot profiles also enforce this gate, regardless of this property's value.
evidence.deployment=${EVIDENCE_DEPLOYMENT:development}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/deal_analyzer}
spring.datasource.username=${DATABASE_USERNAME:deal_analyzer}
spring.datasource.password=${DATABASE_PASSWORD:deal_analyzer}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson2.serialization.indent-output=true
spring.http.converters.preferred-json-mapper=jackson2
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
# The Worker's origin secret (ticket 136). Only a request carrying it is keyed by the Worker's X-Otdog-Client-Address;
# unset, every quota keys on the network peer. The pilot writes it to backend.env alongside nginx.conf.
security.client-address.origin-secret=${ORIGIN_SECRET:}
server.tomcat.connection-timeout=10s
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.threads.max=50
server.tomcat.max-http-form-post-size=21MB
server.max-http-request-header-size=16KB
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web.servlet.PageNotFound=OFF
logging.level.org.apache.pdfbox=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
case.access.pepper=${CASE_ACCESS_PEPPER}
case.access.lifetime=${CASE_ACCESS_LIFETIME:PT720H}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:21MB}
document.limits.max-file-bytes=${DOCUMENT_MAX_FILE_BYTES:20971520}
document.limits.max-pages=${DOCUMENT_MAX_PAGES:25}
document.limits.max-pixels=${DOCUMENT_MAX_PIXELS:40000000}
document.limits.min-width=${DOCUMENT_MIN_WIDTH:1}
document.limits.min-height=${DOCUMENT_MIN_HEIGHT:1}
document.limits.max-expansion-ratio=${DOCUMENT_MAX_EXPANSION_RATIO:10000}
document.retention=${DOCUMENT_RETENTION:PT720H}
document.storage.path=${DOCUMENT_STORAGE_PATH:./var/document-objects}
document.storage.provider=${DOCUMENT_STORAGE_PROVIDER:file}
document.storage.allow-file=${DOCUMENT_STORAGE_ALLOW_FILE:false}
document.storage.s3.bucket=${DOCUMENT_STORAGE_S3_BUCKET:}
document.storage.s3.region=${DOCUMENT_STORAGE_S3_REGION:}
document.storage.encryption-key=${DOCUMENT_STORAGE_ENCRYPTION_KEY:}
document.storage.active-key-id=${DOCUMENT_STORAGE_ACTIVE_KEY_ID:}
document.storage.keys=${DOCUMENT_STORAGE_KEYS:}
document.malware-scanner=${DOCUMENT_MALWARE_SCANNER:clamav}
document.clamav.host=${DOCUMENT_CLAMAV_HOST:127.0.0.1}
document.clamav.port=${DOCUMENT_CLAMAV_PORT:3310}
document.clamav.connect-timeout=${DOCUMENT_CLAMAV_CONNECT_TIMEOUT:PT2S}
document.clamav.read-timeout=${DOCUMENT_CLAMAV_READ_TIMEOUT:PT10S}
document.retention-cleanup-delay=${DOCUMENT_RETENTION_CLEANUP_DELAY:PT5M}
document.heic.decoder-command=${DOCUMENT_HEIC_DECODER_COMMAND:heif-dec}
document.decoder.timeout=${DOCUMENT_DECODER_TIMEOUT:PT10S}
document.normalization.dpi=${DOCUMENT_NORMALIZATION_DPI:144}
document.normalization.max-page-pixels=${DOCUMENT_NORMALIZATION_MAX_PAGE_PIXELS:40000000}
extraction.material-confidence-threshold=${EXTRACTION_MATERIAL_CONFIDENCE_THRESHOLD:0.85}
# deterministic (default) or claude. Selecting claude fails startup until the rollout gate's
# obligations for the deal-terms-prompt.v2 extraction task are met; there is no fallback between them.
extraction.provider=${EXTRACTION_PROVIDER:deterministic}
# Recovery is opt-in. Configure SPRING_MAIL_HOST and credentials only when enabling delivery.
case.recovery.public-url=${CASE_RECOVERY_PUBLIC_URL:http://localhost:5173/}
case.recovery.from=${CASE_RECOVERY_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Amazon SES transactional SMTP; inject credentials from the deployment secret store only.
# Leave host empty for development unless using a local mail sink.
email.ses.region=${SES_REGION:us-east-1}
email.ses.topic-arns=${SES_SNS_TOPIC_ARNS:}
spring.mail.host=${SES_SMTP_HOST:}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME:}
spring.mail.password=${SES_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SES_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SES_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SES_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Local process mode is for development; the pilot profile requires container mode.
document.parser.mode=${DOCUMENT_PARSER_MODE:process}
document.parser.container.executable=${DOCUMENT_PARSER_CONTAINER_EXECUTABLE:/usr/bin/docker}
document.parser.container.endpoint=${DOCUMENT_PARSER_CONTAINER_ENDPOINT:unix:///var/run/docker.sock}
document.parser.container.image=${DOCUMENT_PARSER_CONTAINER_IMAGE:}
document.parser.timeout=${DOCUMENT_PARSER_TIMEOUT:PT20S}
document.parser.heap-mb=${DOCUMENT_PARSER_HEAP_MB:512}
document.parser.max-concurrent=${DOCUMENT_PARSER_MAX_CONCURRENT:2}

# Model-backed paths are off. Enabling them fails startup until the obligations recorded under
# classpath:ai/ are met (see docs/ai-execution-harness.md). Credentials are read by the vendor SDK
# from ANTHROPIC_API_KEY or OPENAI_API_KEY in the environment; there is deliberately no property
# for them. One provider per deployment, with no fallback between providers. An empty model id
# selects the provider's default (claude-opus-5-5 or gpt-6-astra).
ai.model.enabled=${AI_MODEL_ENABLED:false}
ai.model.provider=${AI_MODEL_PROVIDER:anthropic}
ai.model.id=${AI_MODEL_ID:}
ai.model.threshold-set=${AI_MODEL_THRESHOLD_SET:pilot-parameters.v1}
ai.model.evaluation-set=${AI_MODEL_EVALUATION_SET:none}
# Toto, the process guide (ticket 120), is off. It also needs model paths on, which needs executed model
# terms and a passing shadow comparison for TotoAnswerTask (ticket 122), and a reviewed guide (ticket 118).
# Daily caps count UTC days; the spending ceiling counts unpriced and in-flight calls at a worst-case price.
toto.enabled=${TOTO_ENABLED:false}
toto.account-daily-questions=${TOTO_ACCOUNT_DAILY_QUESTIONS:30}
toto.client-daily-questions=${TOTO_CLIENT_DAILY_QUESTIONS:10}
toto.max-clients=${TOTO_MAX_CLIENTS:10000}
toto.daily-spending-ceiling-usd=${TOTO_DAILY_SPENDING_CEILING_USD:20.00}
# Evidence measurement budgets have no defaults. Configure both for pilot/production:
# evidence.budget.per-case-cost-usd=<approved combined market/listing USD ceiling>
# evidence.budget.p95-latency-millis=<approved per-call p95 ceiling in milliseconds>

# Private reply-intake address per case (spec 2.1 section 2.2): the Buyer may forward a dealer's email to it.
# The platform sends no dealer email. fake (default) issues addresses no mail can reach and is refused under
# pilot/production; none issues addresses with no inbound provider. A real inbound provider waits on ticket 78's
# inbound mail authentication prerequisite (signed webhook, replay protection, case binding).
dealer-relay.provider=${DEALER_RELAY_PROVIDER:fake}
dealer-relay.inbound.max-bytes=${DEALER_RELAY_INBOUND_MAX_BYTES:26214400}

# Connected mailbox (spec 2.1 section 2.1, ticket 83): the Buyer connects Gmail or Outlook with a send-only permission
# and approved dealer messages are sent through it. fake (default) records instead of sending and is refused under
# pilot/production; live uses the Gmail and Microsoft Graph adapters; none switches connecting off. Production stays on
# none until the operator's Google OAuth verification (gmail.send) and Microsoft publisher verification (Mail.Send) are
# complete. Tokens are encrypted with their own key of at least 32 bytes, required to connect and under pilot/production.
mailbox.sender=${MAILBOX_SENDER:fake}
mailbox.token-encryption-key=${MAILBOX_TOKEN_ENCRYPTION_KEY:}
mailbox.redirect-uri=${MAILBOX_REDIRECT_URI:${case.recovery.public-url}}
mailbox.google.client-id=${MAILBOX_GOOGLE_CLIENT_ID:}
mailbox.google.client-secret=${MAILBOX_GOOGLE_CLIENT_SECRET:}
mailbox.microsoft.client-id=${MAILBOX_MICROSOFT_CLIENT_ID:}
mailbox.microsoft.client-secret=${MAILBOX_MICROSOFT_CLIENT_SECRET:}
# AGT-11: Connected-mailbox sends per dealer, per Buying Case and per account within the window.
mailbox.caps.per-dealer=${MAILBOX_CAPS_PER_DEALER:10}
mailbox.caps.per-case=${MAILBOX_CAPS_PER_CASE:20}
mailbox.caps.per-account=${MAILBOX_CAPS_PER_ACCOUNT:40}
mailbox.caps.window=${MAILBOX_CAPS_WINDOW:PT24H}

# Sign in with Google or Apple (ticket 113). A provider with blank settings is not offered; pilot/production refuse
# partial settings and require an HTTPS redirect base. Register {redirect-base}/api/v1/account/social-sign-in/google/callback
# and .../apple/callback with the providers. Google may reuse the mailbox Google project, but these are separate
# settings. The Apple private key is the PEM of the Sign in with Apple key; the server signs a short-lived ES256 client
# secret with it for each token request.
account.social-sign-in.redirect-base=${SOCIAL_SIGN_IN_REDIRECT_BASE:${case.recovery.public-url}}
account.social-sign-in.attempt-lifetime=${SOCIAL_SIGN_IN_ATTEMPT_LIFETIME:PT10M}
account.social-sign-in.google.client-id=${SOCIAL_SIGN_IN_GOOGLE_CLIENT_ID:}
account.social-sign-in.google.client-secret=${SOCIAL_SIGN_IN_GOOGLE_CLIENT_SECRET:}
account.social-sign-in.apple.client-id=${SOCIAL_SIGN_IN_APPLE_CLIENT_ID:}
account.social-sign-in.apple.team-id=${SOCIAL_SIGN_IN_APPLE_TEAM_ID:}
account.social-sign-in.apple.key-id=${SOCIAL_SIGN_IN_APPLE_KEY_ID:}
account.social-sign-in.apple.private-key=${SOCIAL_SIGN_IN_APPLE_PRIVATE_KEY:}

# Reference Vehicle VIN decoding (SHOP-02). fake (default) decodes a fixed development sample and is
# refused under pilot/production; nhtsa-vpic calls the free public NHTSA vPIC decoder with the VIN only.
vin-decoder.provider=${VIN_DECODER_PROVIDER:fake}
vin-decoder.nhtsa-vpic.base-url=${VIN_DECODER_NHTSA_VPIC_BASE_URL:https://vpic.nhtsa.dot.gov/api/vehicles}
vin-decoder.nhtsa-vpic.timeout=${VIN_DECODER_NHTSA_VPIC_TIMEOUT:PT4S}
vin-decoder.nhtsa-vpic.attempts=${VIN_DECODER_NHTSA_VPIC_ATTEMPTS:2}
vin-decoder.nhtsa-vpic.retry-delay=${VIN_DECODER_NHTSA_VPIC_RETRY_DELAY:PT0.25S}
