spring.application.name=ai-deal-analyzer
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/deal_analyzer}
spring.datasource.username=${DATABASE_USERNAME:deal_analyzer}
spring.datasource.password=${DATABASE_PASSWORD:deal_analyzer}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true
server.error.include-message=always
case.access.pepper=${CASE_ACCESS_PEPPER}
case.access.lifetime=${CASE_ACCESS_LIFETIME:PT720H}
